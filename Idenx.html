  <style>

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }

    header p { color: var(--text-muted); }

    .container { max-width: 1100px; margin: 0 auto; display: grid; gap: 24px; }
    .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); }

    /* Controles de Busca e Presets */
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    .search-box { display: flex; gap: 8px; flex: 1; min-width: 280px; }
    input[type="text"] { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }

    .btn-preset { background: #334155; font-size: 0.85rem; }

    .slot img { width: 85px; height: 85px; object-fit: contain; }
    .slot h4 { font-size: 0.95rem; text-transform: capitalize; margin: 6px 0 4px; }

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Montador de Times Pokémon & Cobertura de Fraquezas</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #3b82f6;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 24px 16px; }
    
    header { text-align: center; margin-bottom: 24px; }
    header h1 { color: #f59e0b; font-size: 2.2rem; margin-bottom: 6px; }
    header p { color: var(--text-muted); }

    .container { max-width: 1000px; margin: 0 auto; display: grid; gap: 24px; }
    .card { background-color: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid #334155; }

    /* Busca e Ações */
    .search-box { display: flex; gap: 10px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: var(--accent-color); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }

    /* Slots do Time */
    .team-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .slot { background: #0f172a; border: 2px dashed #475569; border-radius: 10px; height: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 8px; text-align: center; }
    .slot.filled { border-style: solid; border-color: var(--accent-color); }
    .slot img { width: 80px; height: 80px; object-fit: contain; }
    .slot .remove-btn { position: absolute; top: 6px; right: 6px; background: #ef4444; color: white; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; }

    /* Badges de Tipos */
    .type-badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; margin: 2px; color: white; background: #64748b; }
    .type-grass { background: #78c850; } .type-poison { background: #a040a0; }
    .type-fire { background: #f08030; } .type-water { background: #6890f0; }
    .type-electric { background: #f8d030; color: #000; } .type-ice { background: #98d8d8; color: #000; }
    .type-fighting { background: #c03028; } .type-ground { background: #e0c068; color: #000; }
    .type-flying { background: #a890f0; } .type-psychic { background: #f85888; }
    .type-bug { background: #a8b820; } .type-rock { background: #b8a038; }
    .type-ghost { background: #705898; } .type-dragon { background: #7038f8; }
    .type-steel { background: #b8b8d0; color: #000; } .type-dark { background: #705848; }

    /* Painel de Resultados */
    .analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 16px; }
    .threat-item, .recommendation-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #0f172a; border-radius: 6px; margin-bottom: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>PokéTeam Builder</h1>
    <p>Monte seu time e descubra os melhores Pokémon para cobrir suas fraquezas.</p>
  </header>

  <div class="container">
    
    <!-- ÁREA DE ADIÇÃO DE POKÉMON -->
    <div class="card">
      <div class="search-box">
        <input type="text" id="pokemonInput" placeholder="Digite o nome ou ID (Ex: bulbasaur, 25)" />
        <button onclick="addPokemon()">Adicionar ao Time</button>
      </div>
      <div class="team-grid" id="teamGrid"></div>
    </div>

    <!-- ANÁLISE DE FRAQUEZAS E RECOMENDAÇÃO -->
    <div class="card">
      <h2>Análise do Time</h2>
      <div class="analysis-grid">
        <div>
          <h3 style="margin-bottom: 10px; color: #f87171;">Ameaças do Time (Vulnerabilidades):</h3>
          <div id="threatsList"><p style="color: var(--text-muted)">Adicione um Pokémon para iniciar a análise.</p></div>
        </div>
        <div>
          <h3 style="margin-bottom: 10px; color: #4ade80;">Tipos Recomendados para Cobertura:</h3>
          <div id="recommendationsList"><p style="color: var(--text-muted)">Adicione um Pokémon para gerar sugestões.</p></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const team = [];
    const cache = { type: {} };

    // Inicializa os 6 slots vazios
    function renderSlots() {
      const grid = document.getElementById('teamGrid');
      grid.innerHTML = '';

      for (let i = 0; i < 6; i++) {
        const slot = document.createElement('div');
        slot.className = `slot ${team[i] ? 'filled' : ''}`;

        if (team[i]) {
          const p = team[i];
          slot.innerHTML = `
            <button class="remove-btn" onclick="removePokemon(${i})">✕</button>
            <img src="${p.sprite}" alt="${p.name}" />
            <strong>${p.name.toUpperCase()}</strong>
            <div>${p.types.map(t => `<span class="type-badge type-${t}">${t}</span>`).join('')}</div>
          `;
        } else {
          slot.innerHTML = `<span style="color: var(--text-muted)">Slot ${i + 1} Vazio</span>`;
        }
        grid.appendChild(slot);
      }
    }

    // Busca relações de danos na PokéAPI (com suporte a cache no navegador)
    async function getTypeData(typeName) {
      if (cache.type[typeName]) return cache.type[typeName];
      const response = await fetch(`[https://pokeapi.co/api/v2/type/$](https://pokeapi.co/api/v2/type/$){typeName}`);
      const data = await response.json();
      cache.type[typeName] = data.damage_relations;
      return data.damage_relations;
    }

    // Adiciona um Pokémon via consulta pública na PokéAPI
    async function addPokemon() {
      const input = document.getElementById('pokemonInput');
      const query = input.value.trim().toLowerCase();

      if (!query) return;
      if (team.length >= 6) return alert('Seu time já possui 6 Pokémon!');

      try {
        const response = await fetch(`[https://pokeapi.co/api/v2/pokemon/$](https://pokeapi.co/api/v2/pokemon/$){query}`);
        if (!response.ok) throw new Error('Pokémon não encontrado.');
        
        const data = await response.json();
        const pokemon = {
          name: data.name,
          types: data.types.map(t => t.type.name),
          sprite: data.sprites.front_default || data.sprites.other['official-artwork'].front_default
        };

        team.push(pokemon);
        input.value = '';
        renderSlots();
        await updateAnalysis();
      } catch (err) {
        alert(err.message);
      }
    }

    function removePokemon(index) {
      team.splice(index, 1);
      renderSlots();
      updateAnalysis();
    }

    // Processa os dados e gera a matriz defensiva e ofensiva
    async function updateAnalysis() {
      const threatsList = document.getElementById('threatsList');
      const recommendationsList = document.getElementById('recommendationsList');

      if (team.length === 0) {
        threatsList.innerHTML = '<p style="color: var(--text-muted)">Adicione um Pokémon para iniciar a análise.</p>';
        recommendationsList.innerHTML = '<p style="color: var(--text-muted)">Adicione um Pokémon para gerar sugestões.</p>';
        return;
      }

      const teamWeaknesses = {};

      for (const pokemon of team) {
        const pokemonWeaknesses = new Set();
        
        for (const typeName of pokemon.types) {
          const relations = await getTypeData(typeName);
          relations.double_damage_from.forEach(t => pokemonWeaknesses.add(t.name));
        }

        pokemonWeaknesses.forEach(w => {
          teamWeaknesses[w] = (teamWeaknesses[w] || 0) + 1;
        });
      }

      // Renderiza Ameaças
      threatsList.innerHTML = Object.entries(teamWeaknesses)
        .sort((a, b) => b[1] - a[1])
        .map(([type, count]) => `
          <div class="threat-item">
            <span class="type-badge type-${type}">${type}</span>
            <span>Ameaça a <strong>${count}</strong> Pokémon</span>
          </div>
        `).join('');

      // Calcula Cobertura Ideal
      const recommendedScores = {};
      for (const threatType of Object.keys(teamWeaknesses)) {
        const relations = await getTypeData(threatType);
        
        // Dano Super Efetivo contra a ameaça (x2)
        relations.double_damage_to.forEach(t => {
          recommendedScores[t.name] = (recommendedScores[t.name] || 0) + 2;
        });
        
        // Resistência defensiva ao ataque da ameaça (x0.5)
        relations.half_damage_from.forEach(t => {
          recommendedScores[t.name] = (recommendedScores[t.name] || 0) + 1;
        });
      }

      // Renderiza Recomendações
      recommendationsList.innerHTML = Object.entries(recommendedScores)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([type, score]) => `
          <div class="recommendation-item">
            <span class="type-badge type-${type}">${type}</span>
            <span>Sinergia: <strong>+${score} pts</strong></span>
          </div>
        `).join('');
    }

    // Inicializa a interface limpa
    renderSlots();
  </script>
</body>
</html>
